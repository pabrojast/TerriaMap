# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      # terriajs is a git dependency with a `prepare` script, so yarn runs a nested
      # install while the outer one is still fetching. Both share ~/.cache/yarn and
      # race on the same tarballs ("Extracting tar content of undefined failed").
      # Give the outer install its own cache, as the Dockerfile already does.
      - run: rm -rf node_modules && yarn install --frozen-lockfile --cache-folder /tmp/yarn-cache
      - run: yarn gulp lint release
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
